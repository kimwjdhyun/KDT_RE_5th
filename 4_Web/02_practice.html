<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>설문조사</h2>
    <hr><br>
    <form>
        이름 <input type="text" placeholder="이름을 입력하세요.">
        <br>
        이메일 <input type="email" placeholder="example@email.com">
        <h4>나이</h4>
        <input type="radio" name="age" checked> 10대 
        <input type="radio" name="age"> 20대
        <input type="radio" name="age"> 30대
        <input type="radio" name="age"> 40대
        <input type="radio" name="age"> 50대
        <input type="radio" name="age"> 60대 이상
        <br><br>
        <h4>원하는 강의(복수 응답 가능합니다.)</h4>
        <input type="checkbox" checked>html
        <input type="checkbox">javascript
        <input type="checkbox">css
        <br><br>
        <textarea placeholder="하고 싶은 말을 입력해주세요." rows="8" cols="80"></textarea> <input type="button" value="제출">
    </form>
</body>
</html>
